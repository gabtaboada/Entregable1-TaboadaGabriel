<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregable Taboada Gabriel</title>

    <!-- libreria Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- libreria Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- TOASTIFY -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">                
    <link rel="stylesheet" href="../assets/css/estilo.css">
    <script defer src="../assets/js/carrito.js"></script>
</head>
<body>
<header>
    <div class="banner-hero">
        <div class="banner-content">
            <h1 class="banner-title">Burger House</h1>
            <p class="banner-subtitle">Armá tu hamburguesa perfecta</p>
            <span class="banner-badge">Pedidos Online</span>
        </div>
    </div>
</header>
    <main>
        <section class="container">
            <div class="row">
                <div class="col">
                    <h1>Simulador de pedidos online de hamburguesas :: Taboada Gabriel</h1>
                </div>
            </div>
            <div class="row">
                <div class="col d-flex justify-content-between align-items-center m-2">
                    <div id="Menu-contenedor" class="d-flex">

                    </div>
                    <div id="Menu-carrito" class="d-flex">

                    </div>                    
                </div>
            </div>            
            <div class="row">
                <div class="col d-flex flex-column justify-content-center align-items-center m-2">
                    <div class="tituloCarrito">
                        <h2>Carrito</h2>
                    </div>
                    <div id="carrito" class="d-flex flex-column gap-3 contenedor-carrito">

                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer></footer>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- TOASTIFY JS     -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>        
    <!-- sweet alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>        
</body>
</html>
